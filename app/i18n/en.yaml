start:
  hello: "👋 Hi! This is the <b>Business Cup 2.0</b> participant bot."
  welcome: |-
    🎉 <b>{name}, congrats on passing the selection!</b>

    You're officially in <b>Business Cup 2.0</b>, with 24 hours ahead to turn an idea into a product 🚀

    {team_line}
    📍 <b>Venue:</b> Nazarbayev University
    🗓 <b>Date:</b> November 14–15

    If you still haven't joined our <a href="{channel}">Telegram channel</a>, we <b>strongly recommend</b> it. All the main news will be there!

    #FromZeroToProductIn24h with AIESEC
  welcome_menu: |-
    <b>What's waiting for you in this bot?</b>

    📢 <b><i>Announcements</i></b>, so you don't miss a thing.

    🙌 <b><i>Attendance confirmation</i></b>, when the time comes.

    ✅ <b><i>Check-in</i></b> at the entrance in a couple of seconds.

    It's all in the menu below 👇
  welcome_team: "👥 <b>Team:</b> {team}"
  welcome_solo: "🙋 <b>Team:</b> solo for now, you can team up on site"
  channel_button: "📣 Join the channel"
  welcome_back: "👋 Welcome back, {name}! It's all in the menu below."
  games_hint: "🎮 <b>While you wait</b>, jump into the games: the photo hunt and the expedition are already open!"
  ask_contact: |-
    👋 Hi! This bot is for <b>Business Cup 2.0</b> participants.

    If you passed the selection, tap the button below and we'll match your number with your application. The personal link from your email works too.
  contact_button: "📱 Share contact"
  not_found: |-
    😔 We couldn't find you on the participant list.

    If this is a mistake, message us: {contact}
  foreign_contact: "🙏 We need <b>your own</b> contact. Send it with the button below."
  token_taken: |-
    🔒 This link is already linked to another Telegram account.

    If it's your link, message us: {contact}
  account_taken: |-
    🔒 Your Telegram is already linked to another participant ({name}).

    If this is a mistake, message us: {contact}
  ambiguous: |-
    🧐 We found several applications with this number, so we couldn't link you automatically.

    Open the bot with the personal link from your email or message us: {contact}
  too_many_attempts: "⏳ Too many attempts. Try again in {minutes} min or message us: {contact}"
  only_registered: "🔒 This is for participants only. Tap /start to get in."

menu:
  checkin: "✅ Check in"
  title: "Menu 👇"
  status: "👤 My status"
  schedule: "🗓 Schedule"
  location: "📍 Location"
  contacts: "☎️ Contacts"
  language: "🌐 Русский"
  games: "🎮 Games"
  games_chat: "💬 Group chat"
  unknown: "🤔 Didn't quite get that. Pick an item from the menu below 👇"
  language_switched: "Language: English 🇬🇧"

status:
  title: "👤 <b>My status</b>"
  name: "Name: <b>{name}</b>"
  team: "Team: <b>{team}</b>"
  solo: "Team: solo"
  you: " (you)"
  attendance: "Attendance confirmation: <b>{answer}</b>"
  checkins: "\n<b>Check-in:</b>"
  checked_at: "✅ checked in, {time}"
  not_checked: "—"

content:
  schedule: |-
    🗓 <b>The schedule</b> will be here closer to the event.

    For now, save the dates: <b>November 14–15</b>, Nazarbayev University.
  location: "📍 <b>Nazarbayev University</b>\nAstana, 53 Kabanbay Batyr Ave"
  contacts: |-
    ☎️ <b>Organizers:</b> {contact}
    📣 <b>Channel:</b> {channel}


poll:
  not_participant: "🔒 This poll is for participants only. Tap /start to get in."
  closed: "⌛ The poll is closed, we're no longer taking answers."
  saved: "✅ Saved: {answer}. You can change it until the deadline."
  ask_reason: "Sorry to hear that 😔 Could you tell us what's in the way? Write one message or skip."
  skip: "Skip"
  reason_thanks: "Thanks, noted 🙏"
  reason_skipped: "OK, no reason 👌"

checkin:
  ok_team: "✅ <b>You're checked in!</b> Day {day}.\n👥 Team {team}: {present}/{total} here."
  ok_solo: "✅ <b>You're checked in!</b> Day {day}.\n\nHave a great hackathon 🚀"
  bingo: "🎲 <b>Bingo is open!</b> Your card is waiting in the games bot."
  open_bingo: "🎲 Open bingo"
  already: "👌 You're already checked in, time: {time}."
  expired: "⏱ The QR code has expired. Scan the screen at the entrance again."
  closed: "⚪ Check-in is closed right now. If you're at the entrance, ask a volunteer."
  need_link: "Almost there! Let's link your account first: open the personal link from your email or tap “📱 Share contact” below, and we'll check you in right away."
  too_many: "⏳ Too many attempts. Ask a volunteer at the entrance or tap the button below."
  call_organizer: "🙋 Call an organizer"
  called: "🙋 The organizers know, someone will come to you. Please wait at the entrance 🙏"
  phone_mismatch: "If you're at the entrance and your Telegram number doesn't match your application, call an organizer and they'll check you in manually."
  scan_with_camera: "📷 Point your phone camera at the QR on the screen at the entrance. Telegram will open the bot and check you in."

commands:
  start: "Start / link your account"
  menu: "Show the menu"
  status: "My status"

errors:
  generic: "😔 Something went wrong. We're on it, please try again a bit later."

start:
  hello: "Hi! This is the Business Cup 2.0 participant bot. Registration, news and check-in are coming soon."
  welcome: |-
    🎉 <b>{name}, you're on the Business Cup 2.0 participant list!</b>

    {team_line}

    Here you'll get announcements, reminders, attendance confirmation and check-in at the entrance. Everything is in the menu below 👇
  welcome_team: "Team: <b>{team}</b>"
  welcome_solo: "You're participating solo — you can team up on site."
  welcome_back: "Welcome back, {name}! The menu is below 👇"
  games_hint: "While you wait — jump into the games: the photo hunt and the expedition are already open 🎮"
  ask_contact: |-
    This bot is for selected Business Cup 2.0 participants.

    If you were selected, tap the button below and the bot will match your phone number with your application. The easiest way is the personal link from your email.
  contact_button: "📱 Share contact"
  not_found: |-
    We couldn't find you on the participant list 😔

    If this is a mistake, contact the organizers: {contact}
  foreign_contact: "Please share <b>your own</b> contact with the button below, not someone else's."
  token_taken: |-
    This link is already linked to another Telegram account.

    If it's your link, contact the organizers: {contact}
  account_taken: |-
    Your Telegram is already linked to another participant ({name}).

    If this is a mistake, contact the organizers: {contact}
  ambiguous: |-
    We found several applications with this number and couldn't link automatically.

    Open the bot with the personal link from your email or contact the organizers: {contact}
  too_many_attempts: "Too many attempts. Try again in {minutes} min or contact the organizers: {contact}"
  only_registered: "This is available to participants only. Tap /start to link your account."

menu:
  checkin: "✅ Check in"
  title: "Menu 👇"
  status: "👤 My status"
  schedule: "🗓 Schedule"
  location: "📍 Location"
  faq: "❓ FAQ"
  contacts: "☎️ Contacts"

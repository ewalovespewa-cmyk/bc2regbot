  language: "🌐 Русский"
  games: "🎮 Games"
  games_chat: "💬 Group chat"
  unknown: "Sorry, I didn't get that 🙂 Pick an item from the menu below."
  language_switched: "Language: English 🇬🇧"

status:
  title: "👤 <b>My status</b>"
  name: "Name: <b>{name}</b>"
  team: "Team: <b>{team}</b>"
  solo: "Team: solo"
  you: " (you)"
  team_legend: "<i>✅ in the bot · ⏳ hasn't opened the bot yet</i>"
  attendance: "“Are you coming?” answer: <b>{answer}</b>"
  attendance_none: "The “Are you coming?” poll hasn't started yet or you haven't answered."
  checkins: "\nCheck-in:"
  checked_at: "✅ checked in at {time}"
  not_checked: "—"

content:
  schedule: "🗓 The schedule will be published closer to the event. Business Cup 2.0 takes place on November 14–15."
  location: "📍 <b>Nazarbayev University</b>\nAstana, 53 Kabanbay Batyr Ave"
  faq: "❓ Answers to common questions are coming soon. Meanwhile, ask your own with “✉️ Ask a question”."
  contacts: "☎️ Organizers: {contact}"

question:
  prompt: "Send your question in one message (a photo is fine). The organizers will reply right here in the bot."
  cancel: "Cancel"
  cancelled: "OK, cancelled."
  sent: "✅ Your question was sent to the organizers. The answer will come here."
  unsupported: "Please send text or a photo with a caption."
  too_long: "Too long — please keep it under {limit} characters."
  rate_limited: "You've asked several questions in a row. Please wait {minutes} min 🙏"
  no_admin_chat: "Questions aren't accepted right now. Contact the organizers directly: {contact}"
  answer: "💬 <b>Reply from the organizers</b>\n\n{answer}"

poll:
  not_participant: "This poll is for participants only. Tap /start to link your account."
  closed: "The poll is closed — answers are no longer accepted."
  saved: "Saved: {answer}. You can change it until the deadline."
  ask_reason: "Sorry to hear that 😔 Could you tell us why? It helps us. Write one message or skip."
  skip: "Skip"
  reason_thanks: "Thank you, noted 🙏"
  reason_skipped: "OK, no reason."

checkin:
  ok_team: "✅ <b>You are checked in!</b> Day {day}.\nTeam {team}: {present}/{total} here."
  ok_solo: "✅ <b>You are checked in!</b> Day {day}. Have a great hackathon!"
  bingo: "🎲 Bingo is open — your card is waiting in the games bot."
  open_bingo: "🎲 Open bingo"
  already: "You are already checked in at {time} 👌"
  expired: "⏱ The QR code has expired — scan the screen at the entrance again."
  closed: "Check-in is closed right now. If you are at the entrance, ask a volunteer."
  need_link: "Almost done! Let us link your account first: open the personal link from your email or tap “📱 Share contact” below — and I will check you in right away."
  too_many: "Too many attempts. Please ask a volunteer at the entrance or tap the button below."
  call_organizer: "🙋 Call an organizer"
  called: "We told the organizers — someone will come to you. Please wait at the entrance 🙏"
  phone_mismatch: "If you are at the entrance and your Telegram number differs from the application, call an organizer and they will check you in manually."
  scan_with_camera: "Point your phone camera at the QR on the screen at the entrance — Telegram will open the bot and check you in."

commands:
  start: "Start / link your account"
  menu: "Show the menu"
  status: "My status"

errors:
  generic: "Something went wrong 😔 We're already on it. Please try again a bit later."

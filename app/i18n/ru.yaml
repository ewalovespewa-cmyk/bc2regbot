start:
  hello: "👋 Привет! Это бот участника <b>Business Cup 2.0</b>."
  welcome: |-
    🎉 <b>{name}, поздравляем с прохождением отбора!</b>

    Теперь ты официально в <b>Business Cup 2.0</b>, и впереди 24 часа, за которые идея превратится в продукт 🚀

    {team_line}
    📍 <b>Venue:</b> Nazarbayev University
    🗓 <b>Date:</b> 14–15 ноября

    Если тебя всё ещё нет в нашем <a href="{channel}">Telegram-канале</a>, <b>настоятельно рекомендуем</b> вступить. Все главные новости будут там!
  welcome_menu: |-
    <b>Что тебя ждёт в этом боте?</b>

    📢 <b><i>Анонсы</i></b>, чтобы ничего не пропустить.

    🙌 <b><i>Подтверждение участия</i></b>, когда подойдёт время.

    ✅ <b><i>Чекин</i></b> на входе за пару секунд.

    Всё уже в меню ниже 👇
  welcome_team: "👥 <b>Team:</b> {team}"
  welcome_solo: "🙋 <b>Team:</b> Looking For Team. Мы подберём тебе команду, stay tuned!"
  channel_button: "📣 Вступить в канал"
  welcome_back: "👋 С возвращением, {name}! Всё в меню ниже."
  games_hint: "🎮 <b>Пока ждёшь проект</b>, заходи в игры: фотохант и экспедиция уже открыты!"
  ask_contact: |-
    👋 Привет! Это бот для участников <b>Business Cup 2.0</b>.

    Если отбор уже пройден, нажми кнопку ниже, и мы сверим номер с твоей заявкой.
  contact_button: "📱 Поделиться контактом"
  not_found: |-
    😔 Не нашли тебя в списке участников.

    Если это ошибка, напиши нам: {contact}
  foreign_contact: "🙏 Нужен именно <b>твой</b> контакт. Отправь его кнопкой ниже."
  token_taken: |-
    🔒 Эта заявка уже привязана к другому Telegram-аккаунту.

    Если заявка твоя, напиши нам: {contact}
  account_taken: |-
    🔒 Твой Telegram уже привязан к другому участнику ({name}).

    Если это ошибка, напиши нам: {contact}
  ambiguous: |-
    🧐 По этому номеру нашлось несколько заявок, так что автоматически не получилось.

    Напиши нам, и мы всё поправим: {contact}
  too_many_attempts: "⏳ Слишком много попыток. Попробуй через {minutes} мин или напиши нам: {contact}"
  only_registered: "🔒 Это только для участников. Нажми /start, чтобы войти."


start:
  hello: "Привет! Это бот участника Business Cup 2.0. Скоро здесь появятся регистрация, новости и чекин."
  welcome: |-
    🎉 <b>{name}, ты в списке участников Business Cup 2.0!</b>

    {team_line}

    Здесь будут анонсы, напоминания, подтверждение участия и чекин на входе. Всё нужное — в меню ниже 👇
  welcome_team: "Команда: <b>{team}</b>"
  welcome_solo: "Ты участвуешь соло — команду можно будет собрать на месте."
  welcome_back: "С возвращением, {name}! Меню ниже 👇"
  games_hint: "Пока ждёшь проект — заходи в игры: фотохант и экспедиция уже открыты 🎮"
  ask_contact: |-
    Этот бот — для отобранных участников Business Cup 2.0.

    Если ты прошёл отбор, нажми кнопку ниже — бот сверит номер телефона с заявкой. Лучше всего открыть бота по персональной ссылке из письма.
  contact_button: "📱 Поделиться контактом"
  not_found: |-
    Не нашли вас в списке участников 😔

    Если это ошибка, напишите организатору: {contact}
  foreign_contact: "Пожалуйста, отправь <b>свой</b> контакт кнопкой ниже, а не контакт другого человека."
  token_taken: |-
    Эта ссылка уже привязана к другому Telegram-аккаунту.

    Если это твоя ссылка, напиши организатору: {contact}
  account_taken: |-
    Твой Telegram уже привязан к другому участнику ({name}).

    Если это ошибка, напиши организатору: {contact}
  ambiguous: |-
    По этому номеру нашлось несколько заявок, автоматически привязать не получилось.

    Открой бота по персональной ссылке из письма или напиши организатору: {contact}
  too_many_attempts: "Слишком много попыток. Попробуй через {minutes} мин или напиши организатору: {contact}"
  only_registered: "Это доступно только участникам. Нажми /start, чтобы привязать аккаунт."


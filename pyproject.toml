[project]
name = "bc2regbot"
version = "0.1.0"
description = "Business Cup 2.0: бот регистрации, коммуникации и чекина участников"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.28,<4",
    "aiohttp>=3.10",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2,<7",
    "structlog>=24.4",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "segno>=1.6",
    "gspread>=6.1",
    "tenacity>=9.0",
    "tzdata>=2024.1",  # часовые пояса для zoneinfo (на Windows и в slim-образе их нет)
    "openpyxl>=3.1",  # выгрузка и импорт Excel
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.26",
    "pgserver>=0.1.4",  # встроенный Postgres для тестов без Docker
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["i18n/*.yaml", "web/templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pgserver.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
